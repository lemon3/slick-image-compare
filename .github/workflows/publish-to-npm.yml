name: Publish to npm

on:
  push:
    branches: main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    name: Publish Core, React & Astro Packages
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: 📦 Set Up Node.js & pnpm
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗 Build All Packages
        run: pnpm run build

      # ✅ Core Package
      - name: ✅ Run Tests for Core
        working-directory: packages/core
        run: pnpm run test

      - name: 🚀 Publish Core Package (staged)
        working-directory: packages/core
        continue-on-error: true # ✅ Prevents workflow failure if publish fails
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          NPM_VERSION=$(npm show $PKG_NAME version || echo "0.0.0")

          if [ "$PKG_VERSION" != "$NPM_VERSION" ]; then
            pnpm stage publish --access public --no-git-checks || echo "⚠️ No new version, skipping publish."
          else
            echo "⚠️ Version $PKG_VERSION already exists. Skipping publish."
          fi

      # ✅ React Package
      - name: ✅ Run Tests for React
        working-directory: packages/react
        run: pnpm run test

      - name: 🚀 Publish React Package (staged)
        working-directory: packages/react
        continue-on-error: true # ✅ Prevents workflow failure if publish fails
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          NPM_VERSION=$(npm show $PKG_NAME version || echo "0.0.0")

          if [ "$PKG_VERSION" != "$NPM_VERSION" ]; then
            pnpm stage publish --access public || echo "⚠️ No new version, skipping publish."
          else
            echo "⚠️ Version $PKG_VERSION already exists. Skipping publish."
          fi

      # ✅ Astro Package (No Build, No Tests)
      - name: 🚀 Publish Astro Package (staged)
        working-directory: packages/astro
        continue-on-error: true # ✅ Prevents workflow failure if publish fails
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          NPM_VERSION=$(npm show $PKG_NAME version || echo "0.0.0")

          if [ "$PKG_VERSION" != "$NPM_VERSION" ]; then
            pnpm stage publish --access public --no-git-checks || echo "⚠️ No new version, skipping publish."
          else
            echo "⚠️ Version $PKG_VERSION already exists. Skipping publish."
          fi
